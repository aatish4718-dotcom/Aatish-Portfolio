# Netlify configuration — digbigstudio.com
#
# There are deliberately no redirect rules here. The site uses hash routing
# (#/photography/lines), so every URL is really "/" as far as the server is
# concerned and there is no SPA fallback to configure.
#
# What this file does do is fix caching. Netlify's default for a static file is
# "public, max-age=0, must-revalidate", which means a returning visitor makes a
# conditional request for every photograph on the page before it can show them.
# For an archive of 141 photographs and 17 clips that is a lot of round trips
# for files that never change.

# There is intentionally no [build] section either. Nothing here needs building,
# and leaving it out means this file cannot override whatever the Netlify UI
# already has configured for the site.

# ── Media: cache hard ────────────────────────────────────────────────────────
# These files are only ever added, never edited in place. If you DO re-export
# something at the same path, a visitor who has it cached will keep the old one
# for up to a year — either give the new file a new name, or drop the max-age
# here to something short while you are iterating.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/design/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/reels/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Code and markup: always revalidate ───────────────────────────────────────
# Small files, and the ones that actually change when you edit the site, so
# they must never be served stale. This is what makes a re-deploy show up
# immediately instead of after a cache expiry.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Baseline security headers ────────────────────────────────────────────────
# The site frames YouTube; nothing needs to frame the site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
